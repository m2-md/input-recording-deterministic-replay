<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Recording & Deterministic Replay Engine</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0b0d13;
        color: #c9d1d9;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        background: #12141c;
        border-radius: 8px;
        max-width: 100vw;
      }
      #hud {
        margin: 0;
        font-variant-numeric: tabular-nums;
        color: #4cc9f0;
        font-size: 13px;
        line-height: 1.5;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        background: #1b2030;
        color: #c9d1d9;
        border: 1px solid #2c3448;
        border-radius: 6px;
        padding: 6px 14px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #232a3d;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="game"></canvas>
    </main>
    <div class="row">
      <button id="record" type="button">Record (R)</button>
      <button id="replay" type="button">Replay (P)</button>
    </div>
    <pre id="hud"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
